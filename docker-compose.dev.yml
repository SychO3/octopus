services:
  octopus-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        GIT_VERSION: ${GIT_VERSION:-dev}
        GIT_AUTHOR: ${GIT_AUTHOR:-hureru}
        BUILD_TIME: ${BUILD_TIME:-2026-06-23 00:00:00 +0800}
        COMMIT_ID: ${COMMIT_ID:-unknown}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
    image: octopus:dev
    container_name: octopus-dev
    ports:
      - '8080:8080'
    volumes:
      # 持久化数据目录
      - './data:/app/data'
      # 可选: 挂载配置文件覆盖默认配置
      # - './config.json:/app/data/config.json'
    environment:
      # 环境变量优先级高于配置文件
      # OCTOPUS_SERVER_PORT: 8080
      # OCTOPUS_SERVER_HOST: 0.0.0.0
      # OCTOPUS_LOG_LEVEL: info
      # OCTOPUS_DATABASE_TYPE: sqlite
      # OCTOPUS_DATABASE_PATH: data/octopus.db
      - TZ=Asia/Shanghai
    restart: unless-stopped
    networks:
      - octopus-network

  # 可选: PostgreSQL 数据库
  # postgres:
  #   image: postgres:16-alpine
  #   container_name: octopus-postgres
  #   environment:
  #     POSTGRES_DB: octopus
  #     POSTGRES_USER: octopus
  #     POSTGRES_PASSWORD: your_secure_password
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data
  #   networks:
  #     - octopus-network
  #   restart: unless-stopped

  # 可选: MySQL 数据库
  # mysql:
  #   image: mysql:8-debian
  #   container_name: octopus-mysql
  #   environment:
  #     MYSQL_DATABASE: octopus
  #     MYSQL_USER: octopus
  #     MYSQL_PASSWORD: your_secure_password
  #     MYSQL_ROOT_PASSWORD: your_root_password
  #   volumes:
  #     - mysql-data:/var/lib/mysql
  #   networks:
  #     - octopus-network
  #   restart: unless-stopped

networks:
  octopus-network:
    driver: bridge

volumes:
  postgres-data:
  mysql-data:
